model = "gpt-5.6-sol"
#model_provider = "kimi_api"
model_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
developer_instructions = """
Also follow `$CODEX_HOME/CODEX.md` (default `~/.codex/CODEX.md`) as user-level guidance when it does not conflict with higher-priority Codex instructions.
Ported skills live in `$CODEX_HOME/skills` (default `~/.codex/skills`); use matching skills for Go, Python, tests, debugging, UI, Android, porting, skill/prompt work, and explicit delegated-agent work.
"""

[features]
hooks = true
image_generation = false
child_agents_md = true
multi_agent = true
sqlite = false

[history]
persistence = "none"
max_bytes = 0

[analytics]
enabled = false

[otel]
log_user_prompt = false

[mcp_servers.context7]
command = "bash"
args = ["-lc", "exec \"${CODEX_HOME:-$HOME/.codex}/bin/context7-mcp\""]

[mcp_servers.omx_state]
command = "omx"
args = ["mcp-serve", "state"]
enabled = false
startup_timeout_sec = 5.0

[mcp_servers.omx_memory]
command = "omx"
args = ["mcp-serve", "memory"]
enabled = false
startup_timeout_sec = 5.0

[mcp_servers.omx_code_intel]
command = "omx"
args = ["mcp-serve", "code-intel"]
enabled = false
startup_timeout_sec = 10.0

[mcp_servers.omx_trace]
command = "omx"
args = ["mcp-serve", "trace"]
enabled = false
startup_timeout_sec = 5.0

[mcp_servers.omx_wiki]
command = "omx"
args = ["mcp-serve", "wiki"]
enabled = false
startup_timeout_sec = 5.0

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[notice]
hide_rate_limit_model_nudge = true

[tui]
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit"]
terminal_title = ["activity", "project-name", "task-progress"]

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "CODEX_OPENROUTER_API_KEY"
env_key_instructions = "Set CODEX_OPENROUTER_API_KEY in ~/.profile (codex-scoped name)."
wire_api = "responses"

[model_providers.openrouter.http_headers]
"HTTP-Referer" = "https://github.com/openai/codex"
"X-Title" = "Codex CLI"

[model_providers.kimi]
name = "Kimi Code"
base_url = "http://127.0.0.1:8463/v1"
wire_api = "responses"

[model_providers.kimi_api]
name = "Kimi (Moonshot) via local responses-bridge proxy"
base_url = "http://127.0.0.1:8463/v1"
wire_api = "responses"

[model_providers.zai]
name = "Z.AI (GLM) via local responses-bridge proxy"
base_url = "http://127.0.0.1:8463/v1"
wire_api = "responses"

[model_providers.deepseek_direct]
name = "DeepSeek (direct via local proxy)"
base_url = "http://127.0.0.1:5000/v1"
wire_api = "responses"

[profiles.deepseek-v4-pro]
model = "deepseek-v4-pro"
model_provider = "deepseek_direct"
model_reasoning_effort = "xhigh"

[profiles.deepseek-v4-flash]
model = "deepseek-v4-flash"
model_provider = "deepseek_direct"
model_reasoning_effort = "xhigh"

[profiles.gpt]
model = "gpt-5.6-sol"
model_provider = "openai"
model_reasoning_effort = "high"

[profiles.kimi-k3]
model = "k3"
model_provider = "kimi_api"
model_reasoning_effort = "max"

[profiles.kimi-k2-code]
model = "kimi-for-coding-highspeed"
model_provider = "kimi_api"
model_reasoning_effort = "max"

[profiles.glm]
model = "zai-coding-plan/glm-5.2"
model_provider = "zai"
model_reasoning_effort = "max"
